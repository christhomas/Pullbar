name: Build

# Every push to main and every pull request is built and signature-checked.
# Pushing a semver tag (v1.2.3, v1.2.3-rc.1) on a main commit also publishes
# a GitHub release with the app zip attached.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $tag is not a semver tag like v1.2.3."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to a commit that is not on main. Releases are built only from main."
            exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle
        run: make app

      - name: Verify code signature
        run: codesign --verify --verbose build/pullbar.app

      - name: Zip app bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: ditto -c -k --keepParent build/pullbar.app "build/pullbar-$VERSION.zip"

      # Hands the zip to the release job only; it is not kept.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: pullbar-app
          path: build/pullbar-*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pullbar-app
          path: dist

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME%%+*}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "pullbar $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
